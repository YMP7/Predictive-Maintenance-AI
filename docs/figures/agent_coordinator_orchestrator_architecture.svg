<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#07192c" />
    </linearGradient>

    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31134a" />
      <stop offset="100%" stop-color="#1c0b2b" />
    </linearGradient>

    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f87171" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Sub-grid Background Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#38bdf8" font-size="28" font-weight="800" letter-spacing="1.5">ATLAS PLATFORM ARCHITECTURE</text>
    <text x="470" y="0" fill="#ffffff" font-size="28" font-weight="300" letter-spacing="1">|</text>
    <text x="490" y="0" fill="#e2e8f0" font-size="28" font-weight="700">Agent Coordinator / Cognition Orchestrator</text>
    <text x="0" y="24" fill="#94a3b8" font-size="14" font-weight="400">Master Cognitive Dispatch, Real-Time Context Bus &amp; Closed-Loop Multi-Criteria Result Fusion</text>
  </g>

  <!-- ==================== TOP AGENTS ROW ==================== -->
  
  <!-- 1. World Model Agent -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#blueCard)" stroke="#0284c7" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#0284c7" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="35" y="21" fill="#e0f2fe" font-size="13" font-weight="700">World Model Agent</text>
    <text x="16" y="54" fill="#94a3b8" font-size="11">Architecture: 2-Layer Attention-LSTM</text>
    <text x="16" y="74" fill="#94a3b8" font-size="11">Perception: L=30 Window Ingestion</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#031a30" stroke="#0369a1" stroke-width="1" />
    <text x="24" y="108" fill="#38bdf8" font-size="11" font-weight="600">Outputs: z ∈ ℝ³² (Latent State)</text>
    <text x="24" y="125" fill="#bae6fd" font-size="11">Health / Stress Index: h ∈ [0, 1]</text>
  </g>

  <!-- 2. Machine DNA Profiling Agent -->
  <g transform="translate(370, 110)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#amberCard)" stroke="#d97706" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#d97706" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#fbbf24" />
    <text x="35" y="21" fill="#fef3c7" font-size="13" font-weight="700">Machine DNA Profiling Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Asset Envelope: 16-dim Standardized</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Features: Baseline μ, σ &amp; Runtime</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#2d1203" stroke="#b45309" stroke-width="1" />
    <text x="24" y="108" fill="#fbbf24" font-size="11" font-weight="600">Outputs: z_DNA = (x - μ) / σ</text>
    <text x="24" y="125" fill="#fde68a" font-size="11">Thermal &amp; Power Operational Signature</text>
  </g>

  <!-- 3. Dual-Path RUL Predictor Agent -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#purpleCard)" stroke="#9333ea" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#9333ea" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#c084fc" />
    <text x="35" y="21" fill="#f3e8ff" font-size="13" font-weight="700">Dual-Path RUL Predictor Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Primary: Mish Non-Linear Head</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Fallback: _EMAFallback (α=0.15, w=5)</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#1e0a2e" stroke="#7e22ce" stroke-width="1" />
    <text x="24" y="108" fill="#c084fc" font-size="11" font-weight="600">Outputs: ŷ_RUL ≥ 0 (Clamped)</text>
    <text x="24" y="125" fill="#e9d5ff" font-size="11">RMSE = 15.42 cycles (C-MAPSS FD001)</text>
  </g>

  <!-- 4. Uncertainty Calibration Agent -->
  <g transform="translate(990, 110)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#greenCard)" stroke="#059669" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#059669" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="35" y="21" fill="#d1fae5" font-size="13" font-weight="700">Uncertainty Calibration Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Decomposition: Aleatoric vs Epistemic</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Neighborhood: k-NN Variance σ²_AMKB</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#022118" stroke="#047857" stroke-width="1" />
    <text x="24" y="108" fill="#34d399" font-size="11" font-weight="600">Outputs: σ² = Var({y_true,i})</text>
    <text x="24" y="125" fill="#a7f3d0" font-size="11">Gaussian Parameter: N(ŷ, max(σ², 10⁻⁶))</text>
  </g>

  <!-- ==================== CENTRAL ORCHESTRATOR HUB ==================== -->
  
  <g transform="translate(370, 330)" filter="url(#shadow)">
    <!-- Main Outer Container -->
    <rect width="590" height="280" rx="20" fill="url(#hubGrad)" stroke="#a855f7" stroke-width="2.5" />
    
    <!-- Header Banner -->
    <rect x="0" y="0" width="590" height="50" rx="20" fill="#7e22ce" fill-opacity="0.35" />
    <circle cx="30" cy="25" r="8" fill="#c084fc" filter="url(#glowPurple)" />
    <text x="50" y="32" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="1">AGENT COORDINATOR / COGNITION ORCHESTRATOR</text>

    <!-- Sub-engines Container 1: Parallel Dispatch & Task Allocator -->
    <g transform="translate(25, 65)">
      <rect width="255" height="90" rx="10" fill="#1b082e" stroke="#9333ea" stroke-width="1.2" />
      <text x="14" y="24" fill="#e9d5ff" font-size="13" font-weight="700">1. Asynchronous Task Allocator</text>
      <text x="14" y="44" fill="#cbd5e1" font-size="11">• Non-blocking concurrent execution</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="11">• L2 heterogeneous schema routing</text>
      <text x="14" y="76" fill="#38bdf8" font-size="11" font-weight="600">Latency: 20.79 – 36.34 ms (p50)</text>
    </g>

    <!-- Sub-engines Container 2: Real-Time Context Bus -->
    <g transform="translate(310, 65)">
      <rect width="255" height="90" rx="10" fill="#1b082e" stroke="#9333ea" stroke-width="1.2" />
      <text x="14" y="24" fill="#e9d5ff" font-size="13" font-weight="700">2. Shared Cognitive Memory Bus</text>
      <text x="14" y="44" fill="#cbd5e1" font-size="11">• Unified 32-dim latent embedding bus</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="11">• Invariant telemetry tensor routing</text>
      <text x="14" y="76" fill="#34d399" font-size="11" font-weight="600">Zero Memory Leak: Δ = 0.07 MB</text>
    </g>

    <!-- Sub-engines Container 3: Result Fusion & State Synthesis -->
    <g transform="translate(25, 170)">
      <rect width="540" height="90" rx="10" fill="#0d0417" stroke="#c084fc" stroke-width="1.4" />
      <text x="18" y="24" fill="#f3e8ff" font-size="14" font-weight="700">3. Multi-Criteria State Synthesis &amp; Safety Audit</text>
      <text x="18" y="46" fill="#cbd5e1" font-size="11">• State Tensor Assembly: Ψ = ⟨z, z_DNA, ŷ_RUL, σ²_AMKB, C_explain, {ϕ_j}⟩</text>
      <text x="18" y="64" fill="#cbd5e1" font-size="11">• Dispatches unified operational context to Monte Carlo Simulation Engine</text>
      <text x="18" y="80" fill="#f87171" font-size="11" font-weight="700">Safety Guard: Intercepts &amp; manages closed-loop counterfactual re-evaluations</text>
    </g>
  </g>

  <!-- ==================== LATERAL AGENTS ==================== -->

  <!-- Left Lateral: AMKB Vector Memory Agent -->
  <g transform="translate(60, 395)" filter="url(#shadow)">
    <rect width="250" height="150" rx="12" fill="url(#greenCard)" stroke="#059669" stroke-width="1.8" />
    <rect x="0" y="0" width="250" height="32" rx="12" fill="#059669" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="35" y="21" fill="#d1fae5" font-size="13" font-weight="700">AMKB Memory Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Store: TimescaleDB pgvector</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Metric: Cosine Distance D_cos (&lt;=&gt;)</text>
    <rect x="14" y="90" width="222" height="46" rx="6" fill="#022118" stroke="#047857" stroke-width="1" />
    <text x="24" y="108" fill="#34d399" font-size="11" font-weight="600">Outputs: Precedents N_k (k=5)</text>
    <text x="24" y="125" fill="#a7f3d0" font-size="11">Strictly ground-truth true_rul</text>
  </g>

  <!-- Right Lateral: Continuous Learning Agent (3% Epsilon Gate) -->
  <g transform="translate(1020, 395)" filter="url(#shadow)">
    <rect width="250" height="150" rx="12" fill="url(#purpleCard)" stroke="#a855f7" stroke-width="1.8" />
    <rect x="0" y="0" width="250" height="32" rx="12" fill="#a855f7" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#c084fc" />
    <text x="35" y="21" fill="#f3e8ff" font-size="13" font-weight="700">Continuous Learning Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Mode: Periodic Batch Retraining</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Trigger: Completed Failure Cycles</text>
    <rect x="14" y="90" width="222" height="46" rx="6" fill="#1b082e" stroke="#7e22ce" stroke-width="1" />
    <text x="24" y="108" fill="#c084fc" font-size="11" font-weight="600">Gate: RMSE_cand ≤ 0.97·RMSE_act</text>
    <text x="24" y="125" fill="#e9d5ff" font-size="11">Atomic Swap + Audit Event Log</text>
  </g>

  <!-- ==================== BOTTOM ROW ==================== -->

  <!-- Bottom Left: Explainability & Attribution Agent -->
  <g transform="translate(60, 680)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#blueCard)" stroke="#0284c7" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#0284c7" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="35" y="21" fill="#e0f2fe" font-size="13" font-weight="700">Explainability Agent (XAI)</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Method: 14-Pass Temporal Occlusion</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Attribution: Δy_j = |f(X) - f(X_\j)|</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#031a30" stroke="#0369a1" stroke-width="1" />
    <text x="24" y="108" fill="#38bdf8" font-size="11" font-weight="600">Confidence: C = s_bar / (1 + Var_y)</text>
    <text x="24" y="125" fill="#bae6fd" font-size="11">Rank Correlation: r_s = -0.5090</text>
  </g>

  <!-- Bottom Center: Resilience & Counterfactual Safety Agent -->
  <g transform="translate(370, 680)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#redCard)" stroke="#dc2626" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#dc2626" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#f87171" />
    <text x="35" y="21" fill="#fee2e2" font-size="13" font-weight="700">Resilience &amp; Safety Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Scenarios: Thermal, Bearing, Dropout</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Constraint: DEF-008 Safety Parity</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#2d0505" stroke="#b91c1c" stroke-width="1" />
    <text x="24" y="108" fill="#f87171" font-size="11" font-weight="600">Override: ŷ ≤ 10 or h ≤ 0.20</text>
    <text x="24" y="125" fill="#fca5a5" font-size="11">Action: Enforce REPLACE_NOW</text>
  </g>

  <!-- Bottom Right Middle: Monte Carlo Decision Support Agent -->
  <g transform="translate(680, 680)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="url(#amberCard)" stroke="#d97706" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#d97706" fill-opacity="0.25" />
    <circle cx="20" cy="16" r="5" fill="#fbbf24" />
    <text x="35" y="21" fill="#fef3c7" font-size="13" font-weight="700">Monte Carlo Decision Agent</text>
    <text x="16" y="54" fill="#cbd5e1" font-size="11">Simulation: 1,000 Stochastic Draws</text>
    <text x="16" y="74" fill="#cbd5e1" font-size="11">Lead Times: τ ∈ {30, 10, 3, 0} cycles</text>
    <rect x="14" y="90" width="252" height="46" rx="6" fill="#2d1203" stroke="#b45309" stroke-width="1" />
    <text x="24" y="108" fill="#fbbf24" font-size="11" font-weight="600">Cost Optimization: argmin E[Cost]</text>
    <text x="24" y="125" fill="#fde68a" font-size="11">Fleet Savings: -47.17% vs Naive</text>
  </g>

  <!-- Bottom Right: Final Decision Output & Human Gate -->
  <g transform="translate(990, 680)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="280" height="32" rx="12" fill="#0284c7" fill-opacity="0.3" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="35" y="21" fill="#ffffff" font-size="13" font-weight="700">Prescribed Decision Output</text>
    <text x="16" y="54" fill="#e2e8f0" font-size="12" font-weight="700">Action: a* (Ranked Interventions)</text>
    <text x="16" y="72" fill="#94a3b8" font-size="11">Expected Cost: $57.50 (vs $1,000)</text>
    <text x="16" y="90" fill="#94a3b8" font-size="11">Risk %: p_fail(a*) + σ_c / 1000</text>
    <rect x="14" y="102" width="252" height="34" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="22" y="123" fill="#38bdf8" font-size="11" font-weight="700">DEF-012b Human Confirmation Gate</text>
  </g>

  <!-- ==================== FLOW CONNECTORS & ARROWS ==================== -->

  <!-- Top Agents to Coordinator -->
  <path d="M 200 260 L 200 300 Q 200 340 400 340" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />
  <path d="M 510 260 L 510 330" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrowAmber)" />
  <path d="M 820 260 L 820 330" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrowPurple)" />
  <path d="M 1130 260 L 1130 300 Q 1130 340 960 340" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />

  <!-- Lateral Agents to Coordinator -->
  <path d="M 310 470 L 370 470" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)" />
  <path d="M 1020 470 L 960 470" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />

  <!-- Coordinator to Bottom Agents -->
  <path d="M 450 610 L 450 645 Q 450 680 200 680" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />
  <path d="M 510 610 L 510 680" fill="none" stroke="#f87171" stroke-width="2.2" marker-end="url(#arrowRed)" />
  <path d="M 820 610 L 820 680" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrowAmber)" />

  <!-- Resilience Feedback Loop back to Coordinator -->
  <path d="M 400 680 C 340 640 340 590 370 550" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRed)" />
  <rect x="290" y="585" width="110" height="24" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1" />
  <text x="297" y="601" fill="#fca5a5" font-size="10" font-weight="700">Re-Evaluate Loop</text>

  <!-- Decision Agent to Output -->
  <path d="M 960 755 L 990 755" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

</svg>
