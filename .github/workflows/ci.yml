name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Fork PRs get a read-only token and no repository secrets. Nothing below
# reads `secrets.*`; every credential is generated per run and discarded with
# the runner. Do not switch this workflow to `pull_request_target`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  # CPU-only torch wheels; the CUDA build is ~2 GB and unused in CI.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check every PR commit has a Signed-off-by matching its author
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        missing=0
        for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
          author="$(git log -1 --format='%an <%ae>' "$sha")"
          if ! git log -1 --format=%B "$sha" | grep -qF "Signed-off-by: $author"; then
            echo "::error::Commit $sha has no 'Signed-off-by: $author' line. See CONTRIBUTING.md."
            missing=1
          fi
        done
        exit $missing

  lint:
    name: Lint (pre-commit — ruff, eslint)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'
    - name: Install client dependencies (eslint hook runs from client/)
      working-directory: ./client
      run: npm ci
    - name: Run pre-commit on all files
      run: |
        python -m pip install --upgrade pip pre-commit
        pre-commit run --all-files --show-diff-on-failure

  adapter-conformance:
    # Required gate for adapter PRs. Runs the SDK conformance suite with the
    # IP-hold modules import-blocked, proving the public surface stands alone.
    # Contributors can narrow it locally with: pytest tests/test_adapter_conformance.py --adapter <id>
    name: Adapter SDK conformance (public boundary)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
        pip install -r requirements-ml.txt --extra-index-url "$TORCH_INDEX"
    - name: Boundary + conformance gate
      env:
        PYTHONPATH: .
      run: python scripts/check_public_boundary.py

  test-backend:
    name: Backend test suite
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Same image as docker-compose.yml so CI and local dev match.
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: digital_twin
          POSTGRES_USER: dtwin
          # Ephemeral DB on a throwaway runner. Derived from the run id so it is
          # not a fixed credential in the repo; it is not a secret.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtwin -d digital_twin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      NOTIFICATIONS_ENABLED: "false"
      DATABASE_URL: postgresql://dtwin:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/digital_twin
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libffi-dev python3-dev
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest httpx
        # torch (CPU wheels) is required by the ATLAS world model / RUL tests
        pip install -r requirements-ml.txt --extra-index-url "$TORCH_INDEX"

    - name: Generate per-run JWT secret
      run: |
        JWT=$(python -c "import secrets; print(secrets.token_hex(32))")
        echo "::add-mask::$JWT"
        echo "JWT_SECRET_KEY=$JWT" >> "$GITHUB_ENV"

    - name: Generate MQTT password file
      run: python scripts/generate_mqtt_passwords.py

    - name: Run database migrations and dev seed
      run: |
        export ADMIN_PASSWORD_HASH=$(python -c "from server.auth import get_password_hash; print(get_password_hash('ci_admin_test_pw_not_real'))")
        export OPERATOR_PASSWORD_HASH=$(python -c "from server.auth import get_password_hash; print(get_password_hash('ci_operator_test_pw_not_real'))")
        python scripts/migrate.py || { echo "Core migration failed"; exit 1; }
        python scripts/migrate_atlas.py || { echo "ATLAS migration failed"; exit 1; }
        python scripts/seed_dev.py || { echo "Seeding failed"; exit 1; }

    - name: Verify database schema
      run: PGPASSWORD="ci-${{ github.run_id }}-${{ github.run_attempt }}" psql -h localhost -U dtwin -d digital_twin -c "\dt"

    - name: Run pytest suite
      run: pytest tests/ -q

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Build React application
      working-directory: ./client
      run: npm run build
