# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
# The eslint hook needs client dependencies: (cd client && npm ci)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]   # 5 MB, the audit threshold for tracked files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4   # matches the ruff version the baseline was measured with
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: eslint
        name: eslint (client)
        entry: npm --prefix client run lint
        language: system
        files: ^client/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
